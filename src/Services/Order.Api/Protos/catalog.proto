syntax = "proto3";

package catalog;

option csharp_namespace = "Catalog";

// Catalog service contract. The DeductStock contract is owned by Catalog.Api (spec 03);
// Order.Api compiles it client-side (spec 04) to deduct stock during checkout.
service CatalogService {
  rpc DeductStock(DeductStockRequest) returns (DeductStockResponse);
}

message DeductStockRequest {
  int32 book_id = 1;
  int32 quantity = 2;
}

message DeductStockResponse {
  bool success = 1;
  int32 remaining_stock = 2;
}
