# Spec 07 Req 8 — nginx config for the built SPA.
# try_files is mandatory: history-mode deep links (/books/1, /admin/books) would
# otherwise 404 on refresh.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed static assets are immutable.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
